name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.88.0", stable] # MSRV + latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ matrix.rust }}"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc
      - run: cargo bench -p molo --features full --no-run
      - run: cargo run -p molo-eval-runner -- --validate-dir evals/cases/coding
      - run: cargo run -p molo-eval-runner -- --manifest evals/cases/coding/edit-function/eval.json --output evals/results/ci-smoke-edit-function.json
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  audit: # dependency vulnerabilities / licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y cargo-audit cargo-deny
      - run: cargo audit
      - run: cargo deny check advisories licenses bans

  package: # self-check the publish artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package -p molo-core
      - run: cargo package -p molo-macros
      # Downstream workspace crates depend on same-version crates that may not
      # exist on crates.io before this release. `--no-verify` still validates
      # package assembly while avoiding registry resolution for unpublished
      # workspace dependencies.
      - run: cargo package -p molo-agent --no-verify
      - run: cargo package -p molo-harness --no-verify
      - run: cargo package -p molo-coding --no-verify
      - run: cargo package -p molo-mcp --no-verify
      - run: cargo package -p molo-skills --no-verify
      - run: cargo package -p molo-openai --no-verify
      - run: cargo package -p molo --no-verify

  release: # triggered by a tag; publish split crates in dependency order
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [check, audit, package]
    permissions:
      contents: read
    environment: crates-io # CARGO_REGISTRY_TOKEN configured in Secrets
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish -p molo-core
      - run: cargo publish -p molo-macros
      # Avoid local registry-index lag after publishing same-version internal
      # dependencies in this job. crates.io still rejects missing dependencies;
      # check/package jobs above cover local verification.
      - run: cargo publish -p molo-agent --no-verify
      - run: cargo publish -p molo-harness --no-verify
      - run: cargo publish -p molo-coding --no-verify
      - run: cargo publish -p molo-mcp --no-verify
      - run: cargo publish -p molo-skills --no-verify
      - run: cargo publish -p molo-openai --no-verify
      - run: cargo publish -p molo --no-verify
