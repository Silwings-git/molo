[workspace]
members = [".", "molo-macros", "molo-cli", "evals/runner"]
resolver = "2"

[package]
name = "molo"
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
description = "An embeddable Rust agent runtime and harness framework for building safe, extensible tool-calling agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Silwings-git/molo.git"
homepage = "https://github.com/Silwings-git/molo"
documentation = "https://docs.rs/molo"
readme = "README.md"
keywords = ["agent", "llm", "ai", "framework"]
categories = ["artificial-intelligence"]
authors = ["silwings"]
# Internal project files are excluded from the published package
exclude = [
    ".example.env",
    "AGENTS.md",
    "CLAUDE.md",
    "docs/",
    "evals/",
    ".github/",
]

[dependencies]
# The path is stripped at publish time; the version is what crates.io resolves
molo-macros = { path = "molo-macros", version = "0.3.0", optional = true }
async-stream = "0.3"
async-trait = "0.1"
base64 = { version = "0.22", optional = true }
futures = "0.3"
indexmap = "2"
jsonschema = { version = "0.49", optional = true }
reqwest = { version = "0.13", features = ["json", "stream"], optional = true }
rmcp = { version = "3.1.2", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", optional = true }
regex = { version = "1", optional = true }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7.19"
tracing = { version = "0.1", optional = true }

[features]
default = []
openai = ["dep:reqwest", "dep:base64", "tokio/net", "tokio/time"]
mcp = [
    "dep:rmcp",
    "dep:reqwest",
    "tokio/process",
    "tokio/net",
    "tokio/io-util",
    "tokio/time",
    "rmcp/client",
    "rmcp/transport-child-process",
    "rmcp/transport-streamable-http-client-reqwest",
]
structured = ["dep:jsonschema", "dep:schemars"]
macros = ["dep:molo-macros", "structured"]
skills = ["structured", "tokio/fs", "tokio/io-util"]
cli-channel = ["tokio/io-std", "tokio/io-util"]
channels = []
tracing = ["dep:tracing"]
harness = []
coding = [
    "harness",
    "dep:regex",
    "tokio/fs",
    "tokio/process",
    "tokio/io-util",
    "tokio/time",
]
full = [
    "openai",
    "mcp",
    "structured",
    "macros",
    "skills",
    "cli-channel",
    "channels",
    "tracing",
    "harness",
    "coding",
]

[dev-dependencies]
rmcp = { version = "3.1.2", features = ["server", "transport-io"] }
dotenvy = "0.15"
evalexpr = "13"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
criterion = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
trybuild = "1"

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "runtime_message"
harness = false

[[bench]]
name = "runtime_harness"
harness = false
required-features = ["harness"]

[[bench]]
name = "coding_primitives"
harness = false
required-features = ["coding"]

