[workspace]
members = [
    ".",
    "molo-core",
    "molo-agent",
    "molo-harness",
    "molo-coding",
    "molo-mcp",
    "molo-skills",
    "molo-openai",
    "molo-macros",
    "molo-cli",
    "evals/runner",
]
resolver = "2"

[package]
name = "molo"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "An embeddable Rust agent runtime and harness framework for building safe, extensible tool-calling agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Silwings-git/molo.git"
homepage = "https://github.com/Silwings-git/molo"
documentation = "https://docs.rs/molo"
readme = "README.md"
keywords = ["agent", "llm", "ai", "framework"]
categories = ["artificial-intelligence"]
authors = ["silwings"]
# Internal project files are excluded from the published package
exclude = [
    ".example.env",
    "AGENTS.md",
    "CLAUDE.md",
    "docs/",
    "evals/",
    ".github/",
]

[dependencies]
# The path is stripped at publish time; the version is what crates.io resolves
molo-core = { path = "molo-core", version = "0.3.0" }
molo-agent = { path = "molo-agent", version = "0.3.0", default-features = false }
molo-harness = { path = "molo-harness", version = "0.3.0", optional = true }
molo-coding = { path = "molo-coding", version = "0.3.0", optional = true }
molo-mcp = { path = "molo-mcp", version = "0.3.0", default-features = false, optional = true }
molo-skills = { path = "molo-skills", version = "0.3.0", optional = true }
molo-openai = { path = "molo-openai", version = "0.3.0", optional = true }
molo-macros = { path = "molo-macros", version = "0.3.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
openai = ["dep:molo-openai"]
mcp = ["dep:molo-mcp"]
structured = ["molo-agent/structured"]
macros = ["dep:molo-macros", "structured"]
skills = ["dep:molo-skills"]
cli-channel = ["molo-agent/cli-channel"]
channels = []
tracing = ["molo-agent/tracing", "molo-core/tracing", "molo-mcp?/tracing", "molo-skills?/tracing"]
harness = ["dep:molo-harness", "molo-mcp?/harness"]
coding = [
    "harness",
    "dep:molo-coding",
]
full = [
    "openai",
    "mcp",
    "structured",
    "macros",
    "skills",
    "cli-channel",
    "channels",
    "tracing",
    "harness",
    "coding",
]

[dev-dependencies]
rmcp = { version = "3.1.2", features = ["server", "transport-io"] }
async-stream = "0.3"
async-trait = "0.1"
dotenvy = "0.15"
evalexpr = "13"
futures = "0.3"
schemars = "1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
criterion = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
trybuild = "1"

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "runtime_message"
harness = false

[[bench]]
name = "runtime_harness"
harness = false
required-features = ["harness"]

[[bench]]
name = "coding_primitives"
harness = false
required-features = ["coding"]

