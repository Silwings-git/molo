[package]
name = "molo-agent"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Agent runtime, memory, channels, and tool registry for molo"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Silwings-git/molo.git"
homepage = "https://github.com/Silwings-git/molo"
documentation = "https://docs.rs/molo-agent"
readme = "../README.md"
keywords = ["agent", "llm", "ai", "framework"]
categories = ["artificial-intelligence"]
authors = ["silwings"]

[lib]
doctest = false

[dependencies]
molo-core = { path = "../molo-core", version = "0.3.0" }
async-stream = "0.3"
async-trait = "0.1"
futures = "0.3"
indexmap = "2"
jsonschema = { version = "0.49", optional = true }
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }
tracing = { version = "0.1", optional = true }

[features]
default = []
structured = ["dep:jsonschema", "dep:schemars"]
cli-channel = ["tokio/io-std", "tokio/io-util"]
tracing = ["dep:tracing", "molo-core/tracing"]

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
