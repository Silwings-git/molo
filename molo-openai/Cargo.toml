[package]
name = "molo-openai"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "OpenAI-compatible provider for molo"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Silwings-git/molo.git"
homepage = "https://github.com/Silwings-git/molo"
documentation = "https://docs.rs/molo-openai"
readme = "../README.md"
keywords = ["agent", "llm", "ai", "framework"]
categories = ["artificial-intelligence"]
authors = ["silwings"]

[lib]
doctest = false

[dependencies]
molo-core = { path = "../molo-core", version = "0.3.0" }
async-trait = "0.1"
async-stream = "0.3"
base64 = "0.22"
futures = "0.3"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["net", "rt", "sync", "time"] }

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
