[package]
name = "molo-mcp"
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
description = "MCP adapter for molo"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Silwings-git/molo.git"
homepage = "https://github.com/Silwings-git/molo"
documentation = "https://docs.rs/molo-mcp"
readme = "../README.md"
keywords = ["agent", "llm", "ai", "framework"]
categories = ["artificial-intelligence"]
authors = ["silwings"]

[lib]
doctest = false

[dependencies]
molo-agent = { path = "../molo-agent", version = "0.3.0" }
molo-core = { path = "../molo-core", version = "0.3.0" }
molo-harness = { path = "../molo-harness", version = "0.3.0", optional = true }
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.13", features = ["json", "stream"] }
rmcp = { version = "3.1.2", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util", "net", "process", "rt", "sync", "time"] }
tracing = { version = "0.1", optional = true }

[features]
default = []
harness = ["dep:molo-harness"]
tracing = ["dep:tracing"]

[dev-dependencies]
rmcp = { version = "3.1.2", features = ["server", "transport-io"] }

