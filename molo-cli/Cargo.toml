[package]
name = "molo-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Reference CLI and dogfooding harness for molo"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Silwings-git/molo.git"
homepage = "https://github.com/Silwings-git/molo"
publish = false

[[bin]]
name = "molo"
path = "src/main.rs"
doc = false

[dependencies]
async-trait = "0.1"
futures = "0.3"
molo = { path = "..", version = "0.3.0", features = [
    "openai",
    "harness",
    "coding",
    "structured",
    "cli-channel",
    "tracing",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "fs", "io-std", "io-util", "process", "time", "signal"] }
tokio-util = "0.7.19"
